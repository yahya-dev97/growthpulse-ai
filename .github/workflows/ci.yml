name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  # Applies the migrations to a throwaway PostgreSQL 17 container, the major version
  # Supabase runs, and exercises the persistence code and role limits against it. This
  # includes the Milestone 5 upgrade from the exact Milestone 4 state, the fail-closed
  # backfill, cross-client isolation, the four roles' boundaries and the Milestone 5
  # revert. Never connects to Supabase.
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          # Container is reachable only from this job, so no password is needed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GROWTHPULSE_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      # Not a development machine: keeps local-only features such as the AI rejection audit off.
      APP_ENV: ci
      # A missing database URL fails the job instead of silently skipping every test.
      GROWTHPULSE_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run pytest -m postgres -ra
