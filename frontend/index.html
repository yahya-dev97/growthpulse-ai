<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GrowthPulse AI</title>
<meta name="description" content="Multi-client performance marketing intelligence — synthetic demonstration build." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M7 21l5-6 4 3 6-9' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..750&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="var(--accent)" />
        <path d="M7 21l5-6 4 3 6-9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span>GrowthPulse&nbsp;AI</span>
      <span class="tag">Synthetic demo</span>
    </div>
    <div class="spacer"></div>
    <span class="chip" id="period-chip" title="Reporting period of the loaded synthetic dataset"></span>
    <label class="label" for="client-select" style="position:absolute;left:-9999px">Client</label>
    <select class="select" id="client-select" aria-label="Client"></select>
    <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.4" />
        <path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3L17 7M7 17l-1.7 1.7" />
      </svg>
    </button>
  </header>

  <nav class="nav" id="tabs" role="tablist" aria-label="Dashboard sections"></nav>
  <div class="nav-rule"></div>

  <div class="scopebar" id="scopebar">
    <span class="label">Scope</span>
    <select class="select" id="account-select" aria-label="Account scope"></select>
    <span class="chip" id="scope-note"></span>
  </div>

  <main id="app" aria-live="polite"></main>

  <footer>
    <span>Synthetic demonstration — every figure derives from GrowthPulse AI's deterministic synthetic dataset through the real analytics pipeline.</span>
    <span>No live advertising data. Sections marked “illustrative” are workflow fixtures.</span>
  </footer>

  <div class="viz-tooltip" id="viz-tooltip" hidden role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
