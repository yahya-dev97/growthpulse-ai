[project]
name = "growthpulse-ai"
version = "0.1.0"
description = "AI-powered performance marketing analysis platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "cryptography>=50.0.2",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "postgres: needs GROWTHPULSE_TEST_DATABASE_URL pointing to a throwaway PostgreSQL server",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# A verbatim copy of the Milestone 4 store, for upgrade tests. Never reformatted.
extend-exclude = ["tests/m4_frozen/store.py", "tests/m4_frozen/rows.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # likely bugs
    "UP",  # modern Python syntax
    "SIM", # simplifications
    "S",   # security checks
]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and deliberately fake credentials.
"tests/**" = ["S101", "S105", "S106"]
